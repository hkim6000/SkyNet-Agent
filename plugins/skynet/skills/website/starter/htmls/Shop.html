<div class="sh-site" data-page="Shop">
<header class="sh-head" id="sh-head">
    <div class="sh-head-row">
        <button type="button" class="sh-burger" aria-label="Menu" onclick="ShopJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <a class="sh-logo" href="Home" aria-label="Paperhouse Prints home"><svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="8" fill="#22303C"/><path d="M11 29V11h11a6 6 0 0 1 0 12H11" fill="none" stroke="#F4EFE6" stroke-width="3"/><circle cx="29" cy="29" r="3" fill="#E07A4F"/></svg><span>Paperhouse</span></a>
        <nav class="sh-nav" id="sh-nav" aria-label="Main">
            <div class="sh-nav-top"><b>Menu</b><button type="button" class="sh-ibtn" aria-label="Close" onclick="ShopJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
            <ul class="sh-menu"><li><a class="sh-ml" href="Home">Home</a></li><li><a class="sh-ml sh-on" href="Shop">Shop</a></li><li><a class="sh-ml" href="Contact">Contact</a></li></ul>
        </nav>
        <div class="sh-search">
            <span class="sh-search-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
            <input type="search" id="sh-q" placeholder="Search prints" autocomplete="off" maxlength="40" oninput="ShopJs.search(this.value)" aria-label="Search prints">
            <div class="sh-sugg" id="sh-sugg"></div>
        </div>
    </div>
    <div class="sh-scrim" id="sh-scrim" onclick="ShopJs.closeNav()"></div>
</header>
<main class="sh-main">
<section class="sh-wrap sh-sec">
    <div class="sh-eyebrow">Shop</div>
    <h1>All prints</h1>
    <div class="sh-bar">
        <div class="sh-chips" id="sh-chips">{plhd_chips}</div>
        <label class="sh-sort"><span>Sort</span><select id="sh-sort" onchange="ShopJs.filter()">{plhd_sort}</select></label>
    </div>
    <input type="hidden" id="sh-cat" value="{plhd_cat}">
    <p class="sh-count" id="sh-count">{plhd_countline}</p>
    <div class="sh-grid" id="sh-grid">{plhd_grid}</div>
</section>
</main>
<footer class="sh-foot">
    <div class="sh-foot-in">
        <div class="sh-fbrand">
            <a class="sh-logo" href="Home"><svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="8" fill="#22303C"/><path d="M11 29V11h11a6 6 0 0 1 0 12H11" fill="none" stroke="#F4EFE6" stroke-width="3"/><circle cx="29" cy="29" r="3" fill="#E07A4F"/></svg><span>Paperhouse</span></a>
            <p>Small-batch art prints, printed by hand.</p>
        </div>
        <form class="sh-nl" onsubmit="return ShopJs.newsletter()" novalidate>
            <label for="sh-nl-email">New prints, once a month</label>
            <div class="sh-nl-row"><input type="email" id="sh-nl-email" placeholder="you@example.com" maxlength="80" autocomplete="email"><button type="submit" class="sh-btn">Sign up</button></div>
            <div class="sh-nl-msg" id="sh-nl-msg" aria-live="polite"></div>
        </form>
    </div>
    <div class="sh-foot-b">&copy; 2026 Paperhouse Prints</div>
</footer>
<div class="sh-toast" id="sh-toast" role="status" aria-live="polite"></div>
</div>
