<div class="lg-site" data-page="AdminLogin" id="lg-site-root">
<main class="lg-main">
    <a class="lg-logo" href="Home"><svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#2F4A3A"/><path d="M12 28V12h16" fill="none" stroke="#F4EFE6" stroke-width="3" stroke-linecap="round"/><circle cx="27" cy="27" r="4" fill="#D9A441"/></svg><span>{plhd_brand}</span></a>
    <section class="lg-card">
        <h1>Staff sign in</h1>
        {plhd_first}
        {plhd_demo}
        <form class="lg-form" id="lg-form" onsubmit="return AdminLoginJs.go()" novalidate>
            <label class="lg-field" for="lg-user"><span>User name</span><input type="text" id="lg-user" maxlength="40" autocomplete="username" value="{plhd_user}"></label>
            <label class="lg-field" for="lg-pass"><span>Password</span><input type="password" id="lg-pass" maxlength="128" autocomplete="current-password" value="{plhd_pass}"></label>
            <div class="lg-choose" id="lg-choose" hidden>
                <p class="lg-note">Choose your own password to finish signing in. Use 8 characters or more.</p>
                <label class="lg-field" for="lg-new"><span>New password</span><input type="password" id="lg-new" maxlength="128" autocomplete="new-password"></label>
                <label class="lg-field" for="lg-new2"><span>New password again</span><input type="password" id="lg-new2" maxlength="128" autocomplete="new-password"></label>
            </div>
            <em class="lg-err" id="lg-err" role="alert"></em>
            <button type="submit" class="lg-btn" id="lg-go">Sign in</button>
        </form>
    </section>
    <a class="lg-back" href="Home">&larr; Back to the website</a>
</main>
</div>
