<div class="tg-site" data-page="AdminThings" id="tg-site-root">
<main class="tg-main" id="tg-main"><div class="tg-loading">Loading</div></main>
<div class="tg-modal" id="tg-modal" aria-hidden="true">
    <div class="tg-mbox" role="dialog" aria-modal="true" aria-labelledby="tg-mtitle">
        <div class="tg-mhead"><h2 id="tg-mtitle"></h2><button type="button" class="tg-ibtn" aria-label="Close" onclick="AdminThingsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="tg-mbody" id="tg-mbody"></div>
    </div>
</div>
<div class="tg-pk" id="tg-pk" aria-hidden="true">
    <div class="tg-mbox tg-pkbox" role="dialog" aria-modal="true" aria-labelledby="tg-pkt">
        <div class="tg-mhead"><h2 id="tg-pkt">Choose photos</h2><button type="button" class="tg-ibtn" aria-label="Close" onclick="AdminThingsJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="tg-mbody">
            <div class="tg-pkbar"><input type="search" id="tg-pkq" placeholder="Search by name or description" maxlength="40" oninput="AdminThingsJs.pkSearch()" aria-label="Search photos"><label class="tg-btn tg-btn-ghost tg-btn-sm tg-upbtn"><input type="file" id="tg-pkfile" multiple accept="image/jpeg,image/png,image/webp,image/gif" onchange="AdminThingsJs.pkUpload()">Upload new</label></div>
            <p class="tg-upmsg" id="tg-pkmsg" role="status"></p>
            <p class="tg-hint" id="tg-pkcount"></p>
            <div class="tg-pkgrid" id="tg-pkgrid"></div>
            <div class="tg-acts"><button type="button" class="tg-btn" onclick="AdminThingsJs.pkUse()">Use these</button><button type="button" class="tg-btn tg-btn-ghost" onclick="AdminThingsJs.pkClose()">Cancel</button></div>
        </div>
    </div>
</div>
<div class="tg-toast" id="tg-toast" role="status" aria-live="polite"></div>
</div>
