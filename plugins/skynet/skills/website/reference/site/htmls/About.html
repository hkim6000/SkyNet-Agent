<div class="ab-site" data-page="About">
<header class="ab-head" id="ab-head">
    <div class="ab-head-row">
        <button type="button" class="ab-burger" aria-label="Menu" onclick="AboutJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <a class="ab-logo" href="Home" aria-label="Paperhouse Prints home"><svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="8" fill="#22303C"/><path d="M11 29V11h11a6 6 0 0 1 0 12H11" fill="none" stroke="#F4EFE6" stroke-width="3"/><circle cx="29" cy="29" r="3" fill="#E07A4F"/></svg><span>Paperhouse</span></a>
        <nav class="ab-nav" id="ab-nav" aria-label="Main">
            <div class="ab-nav-top"><b>Menu</b><button type="button" class="ab-ibtn" aria-label="Close" onclick="AboutJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
            <ul class="ab-menu"><li><a class="ab-ml" href="Home">Home</a></li><li><a class="ab-ml" href="Shop">Shop</a></li><li><a class="ab-ml ab-on" href="About">About</a></li><li><a class="ab-ml" href="Contact">Contact</a></li></ul>
        </nav>
        <div class="ab-search">
            <span class="ab-search-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
            <input type="search" id="ab-q" placeholder="Search prints" autocomplete="off" maxlength="40" oninput="AboutJs.search(this.value)" aria-label="Search prints">
            <div class="ab-sugg" id="ab-sugg"></div>
        </div>
    </div>
    <div class="ab-scrim" id="ab-scrim" onclick="AboutJs.closeNav()"></div>
</header>
<main class="ab-main">
{plhd_blocks}
</main>
<footer class="ab-foot">
    <div class="ab-foot-in">
        <div class="ab-fbrand">
            <a class="ab-logo" href="Home"><svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="8" fill="#22303C"/><path d="M11 29V11h11a6 6 0 0 1 0 12H11" fill="none" stroke="#F4EFE6" stroke-width="3"/><circle cx="29" cy="29" r="3" fill="#E07A4F"/></svg><span>Paperhouse</span></a>
            <p>{plhd_tagline}</p>
        </div>
    </div>
    <div class="ab-foot-b">&copy; 2026 Paperhouse Prints</div>
</footer>
<div class="ab-toast" id="ab-toast" role="status" aria-live="polite"></div>
</div>
