<div class="db-site" data-page="Admin" id="db-site" data-start="{plhd_start}">
<header class="db-top">
    <button type="button" class="db-burger" aria-label="Menu" onclick="AdminJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="db-logo" href="Admin" onclick="return AdminJs.go(event, 'AdminHome')"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#2F4A3A"/><path d="M12 28V12h16" fill="none" stroke="#F4EFE6" stroke-width="3" stroke-linecap="round"/><circle cx="27" cy="27" r="4" fill="#D9A441"/></svg><span>{plhd_brand}</span><small>Staff</small></a>
    <div class="db-who" id="db-who"></div>
    <a class="db-tl db-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="db-tl" onclick="AdminJs.signout()">Sign out</button>
</header>
<div class="db-body">
    <nav class="db-rail" id="db-rail" aria-label="Staff menu">
        <div class="db-rail-top"><b>Menu</b><button type="button" class="db-ibtn" aria-label="Close menu" onclick="AdminJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="db-menu" id="db-menu"></div>
    </nav>
    <div class="db-scrim" id="db-scrim" onclick="AdminJs.closeMenu()"></div>
    <main class="db-content" id="db-content" aria-live="polite"></main>
</div>
<div class="db-toast" id="db-toast" role="status" aria-live="polite"></div>
</div>
